name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 与 Dockerfile 的 node:24 生产镜像一致。
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Unit tests
        run: npm run test:all
      - name: Editorial data check
        run: npm run test:radar-data
      - name: Build
        run: npm run build
      - name: Sites handoff check
        run: npm run test:sites

  # skills/enterprise-business-proposal 自带的 Python 单元测试与报价校验 CLI。
  skill:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Skill unit tests
        run: python -m unittest discover -s skills/enterprise-business-proposal/tests -p "test_*.py"
      - name: Exercise quote CLI
        run: python skills/enterprise-business-proposal/scripts/validate_quote.py skills/enterprise-business-proposal/examples/synthetic-quote.json
